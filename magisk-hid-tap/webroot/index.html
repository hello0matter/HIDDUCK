<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>HID Duck</title>
<style>
body{font-family:sans-serif;background:#111;color:#eee;margin:0;padding:16px}
textarea{width:100%;height:42vh;background:#1b1b1b;color:#eee;border:1px solid #444;border-radius:10px;padding:12px;font-size:16px;box-sizing:border-box}
button{width:100%;padding:18px;margin-top:12px;font-size:20px;border:0;border-radius:12px;background:#1565c0;color:#fff}
pre{white-space:pre-wrap;background:#222;padding:12px;border-radius:8px;min-height:72px}
</style></head>
<body>
<h2>执行 Duck 脚本</h2>
<p>Pixel 不用开 HID。USB 插电脑，先点记事本，再点执行。</p>
<textarea id="duck">DELAY 500
STRING NH HID SAFE TEST
ENTER</textarea>
<button onclick="go()">执行</button>
<pre id="out">ready</pre>
<script>
function b64(s){
  return btoa(unescape(encodeURIComponent(s)));
}
function execShell(cmd){
  return new Promise((resolve) => {
    if (!(window.ksu && ksu.exec)) {
      resolve('NO_WEBUI');
      return;
    }
    const cb = 'cb' + Date.now();
    window[cb] = (errno, stdout, stderr) => {
      resolve(((stdout||'') + (stderr||'') + '\ncode=' + errno).trim());
    };
    ksu.exec(cmd, '{}', cb);
  });
}
async function go(){
  const duck = document.getElementById('duck').value;
  const out = document.getElementById('out');
  if (!duck.trim()) { out.textContent = 'empty'; return; }
  out.textContent = 'running...';
  const cmd = "echo " + b64(duck) + " | base64 -d > /data/local/tmp/hid-input.duck && sh /data/adb/modules/hid-tap/hid-ctl.sh exec";
  out.textContent = await execShell(cmd);
}
</script>
</body></html>
